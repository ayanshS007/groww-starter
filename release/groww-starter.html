."},{id:"hybrid-fund",term:"Hybrid fund",meaning:"A fund that mixes shares and bonds to smooth out the ride.",analogy:"Like a thali: a bit of everything so no single dish dominates."},{id:"volatility",term:"Volatility",meaning:"How much and how often a price moves up and down.",analogy:"Like a bumpy road versus a smooth highway."},{id:"kyc",term:"KYC",meaning:"Know Your Customer: a one-time identity check that every investment app must do.",analogy:"Like showing ID once to open a bank account."},{id:"upi-autopay",term:"UPI autopay",meaning:"A permission that lets your SIP be paid from your bank by UPI each month.",analogy:"Like auto-renew on a subscription, which you can cancel any time."},{id:"mandate",term:"Mandate",meaning:"Your one-time approval for automatic payments up to a set limit.",analogy:"Like giving a standing instruction to your bank."},{id:"step-up",term:"Step-up",meaning:"Raising your SIP amount automatically once a year, here by 10%.",analogy:"Like a yearly raise for your future self."},{id:"cushion",term:"Cushion",meaning:"Money kept aside for surprises, usually about 3 months of income.",analogy:"Like a spare tyre: you hope not to need it, but you’re glad it’s there."},{id:"stocks-vs-funds",term:"Stocks vs funds",meaning:"A stock is one company. A fund holds many, so one bad company hurts less.",analogy:"Like betting on one player versus backing the whole team."},{id:"delivery-vs-intraday",term:"Delivery vs intraday",meaning:"Delivery means you keep the shares. Intraday means buying and selling the same day.",analogy:"Like buying a bike to ride versus flipping it the same afternoon."},{id:"market-order",term:"Market order",meaning:"Buy at whatever the current price is, right away.",analogy:"Like buying at the price on the shelf today."},{id:"limit-order",term:"Limit order",meaning:"Buy only if the price is at or below the price you set.",analogy:"Like telling a shop to call you if the price drops to your budget."},{id:"f-and-o",term:"F&O",meaning:
